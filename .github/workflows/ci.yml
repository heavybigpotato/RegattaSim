name: build

# Phase 0's acceptance criterion is that a push produces something installable on
# a phone. Everything here serves that, plus the checks that stop a "improved"
# shader from quietly ruining the ocean.

# A branch with an open pull request would otherwise build twice for every
# commit, once for the push and once for the pull_request, and the two runs
# cannot cancel each other because their refs differ. Pushes are therefore
# limited to the branches that publish something; everything else is covered by
# the pull_request run.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests and shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install shader validator and a virtual display
        # glslangValidator compiles every shader without a GPU; xvfb plus Mesa's
        # software rasteriser lets the renderer actually run in CI, which is what
        # makes the GPU checks below possible on a machine with no graphics card.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslang-tools xvfb libgl1 libglx-mesa0 mesa-utils

      - name: Physics and spectrum tests
        run: ./gradlew :core:test :core:checkCorePurity --no-daemon

      - name: Shader validation
        run: ./gradlew :render:validateShaders --no-daemon

      - name: GPU FFT matches the CPU reference
        # The GLSL transform is a transliteration of the tested CPU one. This runs
        # both on the same sea state and compares the wave fields texel by texel,
        # which is the only way a transposed index or a conjugated twiddle gets
        # caught - all of those still produce something that looks like water.
        run: xvfb-run -a ./gradlew :desktop:verifyGpuFft --no-daemon

      - name: Render reference scenes
        run: xvfb-run -a ./gradlew :desktop:renderReferenceScenes --no-daemon

      - name: Upload reference scenes
        uses: actions/upload-artifact@v4
        with:
          name: reference-scenes
          path: desktop/build/reference-scenes/*.png
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  web:
    name: webgl showcase
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install node dependencies
        working-directory: tools
        run: npm install --no-fund --no-audit

      - name: Shaders are in sync with the native sources
        # docs/ocean/shaders.js is generated. If it drifts from
        # render/src/main/resources/shaders, the web preview stops being evidence
        # about the renderer it claims to preview, so regenerating must be a no-op.
        run: |
          ./gradlew :render:generateWebShaders --no-daemon
          git diff --exit-code -- docs/ocean/shaders.js

      - name: The web maths agrees with core
        # docs/ocean/spectrum.js is a hand transliteration of the Java. A lost sign
        # or a mis-ported hash still yields a plausible ocean - just not this one -
        # so both are evaluated for one sea state and compared value by value.
        run: |
          ./gradlew :core:dumpSpectrum -q --no-daemon > java-spectrum.json
          node tools/web-parity-check.js java-spectrum.json

      - name: Install browser
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Run the WebGL ocean
        # Served rather than opened from disk: the page is an ES module and
        # file:// origins cannot import.
        run: |
          python3 -m http.server 8712 --directory docs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8712/ocean/ >/dev/null && break
            sleep 1
          done
          node tools/web-ocean-check.js http://localhost:8712/ocean/ web-ocean.png 150

      - name: Upload the WebGL screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ocean
          path: web-ocean.png
          if-no-files-found: ignore

  apk:
    name: android apk
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # The debug key is the standard Android one, so the artifact installs
        # straight from a phone with no keystore secret. That matters: needing a
        # secret would stop this working on a fork or a fresh clone.
        run: ./gradlew :android:assembleDebug --no-daemon

      - name: Name the APK after the commit
        run: |
          mkdir -p artifacts
          cp android/build/outputs/apk/debug/android-debug.apk \
             "artifacts/blue-meridian-${GITHUB_SHA::8}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-meridian-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        # Tagged builds become permanent releases; pushes to the default branch
        # update a rolling "latest" release, which is the link you keep on your
        # phone. Either way installing is: open the release, tap the APK, allow
        # this source once.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: artifacts/*.apk
          body: |
            Blue Meridian, built from `${{ github.sha }}`.

            Install: download the APK on your phone, allow installation from this
            source when prompted, open it. The reference ocean screenshots for this
            build are attached to the workflow run as the `reference-scenes`
            artifact.
