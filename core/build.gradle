// Pure JVM. No libGDX, no Android, no OpenGL: enforced by the check below.
// This module is shared verbatim with the (future) authoritative server, so
// anything that cannot run headless on a plain JVM does not belong here.

dependencies {
    // intentionally empty: core has no runtime dependencies
}

def forbiddenPackages = ['com.badlogic.gdx', 'android.', 'androidx.']

tasks.register('checkCorePurity') {
    description = 'Fails if core ever imports libGDX or Android.'
    group = 'verification'
    def srcDir = file('src/main/java')
    inputs.dir srcDir
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        srcDir.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                f.eachLine { line ->
                    if (line.startsWith('import ')) {
                        def imported = line.substring(7).trim()
                        forbiddenPackages.each { pkg ->
                            if (imported.startsWith(pkg)) {
                                offenders << "${f.name}: ${line.trim()}"
                            }
                        }
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "core must stay free of graphics/Android imports:\n  " + offenders.join('\n  '))
        }
    }
}

tasks.named('check') { dependsOn 'checkCorePurity' }

// Prints the authoritative ocean numbers as JSON so the WebGL build's
// transliterated maths can be checked against them. See tools/web-parity-check.js.
tasks.register('dumpSpectrum', JavaExec) {
    description = 'Prints reference ocean values as JSON.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bluemeridian.core.tools.SpectrumDump'
}

// Bakes the hull for the browser. Unlike the spectrum and the sailing model, the
// geometry is static and nothing but the renderer consumes it, so a hand
// transliteration would be six hundred lines of duplication kept in step by a
// checksum with nothing gained. One definition, one set of vertices.
tasks.register('generateWebBoat', JavaExec) {
    description = 'Writes docs/ocean/boat-hull.js from HullLoft.'
    group = 'build'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bluemeridian.core.tools.BoatMeshDump'
    def output = rootProject.file('docs/ocean/boat-hull.js')
    outputs.file output
    doFirst {
        output.parentFile.mkdirs()
        standardOutput = new FileOutputStream(output)
    }
}

// Emits the polar tables as a JavaScript module for the WebGL showcase, from the
// same CSV the JVM parses. Same reasoning as the shader bundle: a hand-copied
// table would drift, and then the browser would be sailing a different boat.
tasks.register('generateWebPolars') {
    description = 'Writes docs/ocean/polars.js from core/src/main/resources/polars.'
    group = 'build'
    def polarDir = file('src/main/resources/polars')
    def output = rootProject.file('docs/ocean/polars.js')
    inputs.dir polarDir
    outputs.file output

    doLast {
        def entries = []
        polarDir.listFiles().sort { it.name }.each { f ->
            if (!f.name.endsWith('.csv')) {
                return
            }
            entries << "  ${groovy.json.JsonOutput.toJson(f.name)}: " +
                    "${groovy.json.JsonOutput.toJson(f.text)}"
        }
        output.parentFile.mkdirs()
        output.text = "// GENERATED by ./gradlew :core:generateWebPolars - do not edit.\n" +
                "//\n" +
                "// Source of truth: core/src/main/resources/polars/. The CSV text is carried\n" +
                "// verbatim, comments and all, and parsed in the browser by the same rules the\n" +
                "// JVM uses, so the browser and the game sail the same boat.\n" +
                "export const POLAR_CSV = {\n" + entries.join(',\n') + "\n};\n"
        logger.lifecycle("wrote ${output} (${entries.size()} polars)")
    }
}
