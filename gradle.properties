# Dependency versions, single source of truth for every module.
gdxVersion=1.13.5
junitVersion=5.10.2
junitPlatformVersion=1.10.2

# Android
#
# compileSdk is 35 while targetSdk stays 34, and the two mean different things:
# compileSdk is which APIs the code is compiled against, targetSdk is which
# runtime behaviours the app opts in to. libGDX 1.13.5's Android backend depends
# on androidx.core:core:1.15.0, whose AAR metadata requires anything using it to
# compile against 35 or later, so compileSdk has to move. Raising targetSdk as
# well would additionally opt into Android 15's enforced edge-to-edge layout,
# which is a real behavioural change and deserves its own testing rather than
# being smuggled in behind a dependency bump.
#
# AGP 8.5.2 warns that it was tested only up to compileSdk 34. That is a warning,
# not a limit. Bumping AGP is the tidier follow-up, deliberately not bundled here:
# Google's Maven repository is unreachable from this build container, so an AGP
# version could not be verified locally, and guessing one would trade a warning
# for a possible hard failure.
androidGradlePluginVersion=8.5.2
androidCompileSdk=35
androidMinSdk=24
androidTargetSdk=34

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
