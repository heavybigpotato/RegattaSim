// Rendering: shaders, ocean surface, sky, post-processing.
// Depends on libGDX core only - never on a backend. Backends are chosen by the
// launcher modules (desktop/android), which keeps this module portable.

dependencies {
    api project(':core')
    api "com.badlogicgames.gdx:gdx:${gdxVersion}"
}

// Every GLSL file under resources is validated at build time by glslangValidator
// when it is installed. This catches shader syntax errors without a GPU, which
// is the only cheap defence against "it compiled but the ocean is black".
tasks.register('validateShaders', Exec) {
    description = 'Runs glslangValidator over all shaders (skipped if not installed).'
    group = 'verification'
    def script = file('validate-shaders.sh')
    inputs.dir file('src/main/resources/shaders')
    inputs.file script
    outputs.file layout.buildDirectory.file('shader-validation.log')
    commandLine 'sh', script.absolutePath
    workingDir projectDir
}

tasks.named('check') { dependsOn 'validateShaders' }

// Bundles the shaders into a single JavaScript file for the WebGL showcase, with
// "#pragma include" resolved exactly as ShaderSources does at runtime.
//
// The point is that the web preview and the native client run the *same* shader
// text. A hand-maintained copy would drift within a week, and the preview would
// quietly stop being evidence about the real renderer. CI regenerates this and
// fails if the result differs from what is committed.
tasks.register('generateWebShaders') {
    description = 'Writes docs/ocean/shaders.js from the shader sources.'
    group = 'build'
    def shaderDir = file('src/main/resources/shaders')
    def output = rootProject.file('docs/ocean/shaders.js')
    inputs.dir shaderDir
    outputs.file output

    doLast {
        def resolve
        resolve = { String name, List<String> stack ->
            if (stack.contains(name)) {
                throw new GradleException("circular shader include: ${stack} -> ${name}")
            }
            def f = new File(shaderDir, name)
            if (!f.exists()) {
                throw new GradleException("shader not found: ${name}")
            }
            def out = new StringBuilder()
            f.eachLine { line ->
                def trimmed = line.trim()
                if (trimmed.startsWith('#pragma include')) {
                    def first = trimmed.indexOf('"')
                    def last = trimmed.lastIndexOf('"')
                    if (first < 0 || last <= first) {
                        throw new GradleException("malformed include in ${name}: ${trimmed}")
                    }
                    out.append(resolve(trimmed.substring(first + 1, last), stack + name)).append('\n')
                } else {
                    out.append(line).append('\n')
                }
            }
            return out.toString()
        }

        def entries = []
        shaderDir.listFiles().sort { it.name }.each { f ->
            if (f.name.endsWith('.vert') || f.name.endsWith('.frag')) {
                entries << "  ${groovy.json.JsonOutput.toJson(f.name)}: ${groovy.json.JsonOutput.toJson(resolve(f.name, []))}"
            }
        }

        output.parentFile.mkdirs()
        output.text = "// GENERATED by ./gradlew :render:generateWebShaders - do not edit.\n" +
                "//\n" +
                "// Source of truth: render/src/main/resources/shaders/. These are the exact\n" +
                "// shaders the Android and desktop clients compile, with #pragma include\n" +
                "// resolved. WebGL 2's shading language is GLSL ES 3.00, which is what they\n" +
                "// were written against, so they need no translation at all.\n" +
                "export const SHADERS = {\n" + entries.join(',\n') + "\n};\n"
        logger.lifecycle("wrote ${output} (${entries.size()} shaders)")
    }
}
